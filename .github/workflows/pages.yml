name: Publish CapCut FJ
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps --workspaces=false
        working-directory: mobile
      - run: ln -s ../../mobile/node_modules apps/web/node_modules
      - run: node tests/storage-import.mjs
        working-directory: mobile
      - run: npm run build
        working-directory: mobile
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
